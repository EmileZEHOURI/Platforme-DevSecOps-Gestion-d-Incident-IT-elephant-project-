name: CI

on:
  push:
    branches:
      - main
      - dev

  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  backend:
    name: Backend quality
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      APP_NAME: Incident Management API
      ENVIRONMENT: test
      SQL_ECHO: "false"
      DATABASE_URL: postgresql+psycopg://incident_app:ci_password@localhost:5432/incident_management

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6

      - name: Installer uv
        uses: astral-sh/setup-uv@v8
        with:
          working-directory: backend
          enable-cache: true

      - name: Installer les dépendances
        run: uv sync --locked

      - name: Vérifier le lint Python
        run: uv run --no-sync ruff check .

      - name: Vérifier le formatage Python
        run: uv run --no-sync ruff format --check .

      - name: Exécuter les tests
        run: uv run --no-sync pytest

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    env:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier le lint TypeScript
        run: npm run lint

      - name: Construire le front-end
        run: npm run build